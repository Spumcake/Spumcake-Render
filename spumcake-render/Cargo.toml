[package]
name = "spumcake-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Renders Spumcake scene files the way the pre-vis builders do, on wgpu, as a library and from the command line."

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
png = "=0.18.1"
pollster = "=0.4.0"
# 3D Viewport Work's reader. Until both crates are committed side by side, it is read from that session's
# worktree; at the merge this becomes "../scene".
scene = { path = "../../3d-viewport/scene" }
wgpu = "=30.0.1"

[dev-dependencies]
serde_json = "=1.0.152"
